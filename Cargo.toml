# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-process"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-process"
description = "Configured Xmip Process execution contracts."

[lib]
# A directory of many usages keeps its source aside (ADR-0049).
path = ".src/lib.rs"

[dependencies]
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
message = { package = "xmip-core-message", git = "https://github.com/IlleNilsson/xmip-core-message", branch = "main" }